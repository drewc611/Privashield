name: Bug report
description: Report a reproducible defect that is not a security vulnerability
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities, credentials, private packet captures, or sensitive security data here. Follow SECURITY.md for security disclosures.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproducible example.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.x or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, architecture, deployment method
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, credentials, personal data, and sensitive telemetry.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I verified this is not a vulnerability disclosure.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
