# Temporary branch-only compiler. Remove before merge.
name: Compile Agentic Maintainer

on:
  push:
    branches:
      - chore/github-agentic-maintainer
    paths:
      - .github/workflows/daily-autonomous-maintainer.md
      - .github/workflows/compile-agentic-maintainer.yml

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/github-agentic-maintainer

      - name: Install GitHub CLI agentic-workflows extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw

      - name: Compile hardened lock workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile daily-autonomous-maintainer --strict

      - name: Upload compiler outputs
        uses: actions/upload-artifact@v4
        with:
          name: agentic-maintainer-compiled
          if-no-files-found: error
          path: |
            .github/workflows/daily-autonomous-maintainer.lock.yml
            .github/aw/actions-lock.json
            .gitattributes
