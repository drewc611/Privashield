name: Compile Agentic Workflow

on:
  push:
    branches: [feat/agentic-daily-progress]
    paths:
      - ".github/workflows/daily-progress.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/agentic-daily-progress
          fetch-depth: 0

      - name: Install pinned gh-aw
        shell: bash
        run: |
          curl -fsSL https://github.com/github/gh-aw/releases/download/v0.89.12/linux-amd64 -o /tmp/gh-aw
          echo "758fdfd7060651c3df5213335ff37003fb82cc31741dc6c934b487a7aa422880  /tmp/gh-aw" | sha256sum -c -
          chmod +x /tmp/gh-aw
          /tmp/gh-aw version

      - name: Compile strict workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/gh-aw compile daily-progress --strict

      - name: Commit compiled workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/daily-progress.lock.yml
          if [ -f .github/aw/actions-lock.json ]; then
            git add .github/aw/actions-lock.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: compile daily progress agentic workflow"
          git push
