name: Compile Agentic Workflow

on:
  push:
    branches: [feat/agentic-daily-progress]
    paths:
      - ".github/workflows/daily-progress.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/agentic-daily-progress
          fetch-depth: 0

      - name: Install pinned gh-aw
        shell: bash
        run: |
          curl -fsSL https://github.com/github/gh-aw/releases/download/v0.89.12/linux-amd64 -o /tmp/gh-aw
          echo "758fdfd7060651c3df5213335ff37003fb82cc31741dc6c934b487a7aa422880  /tmp/gh-aw" | sha256sum -c -
          chmod +x /tmp/gh-aw
          /tmp/gh-aw version

      - name: Compile strict workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/gh-aw compile daily-progress --strict

      - name: Export compiled workflow
        uses: actions/upload-artifact@v4
        with:
          name: compiled-daily-progress
          path: |
            .github/workflows/daily-progress.lock.yml
            .github/aw/actions-lock.json
          if-no-files-found: error
          retention-days: 1
