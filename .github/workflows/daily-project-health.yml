name: Daily Project Health

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  security-events: read

concurrency:
  group: privashield-daily-project-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and audit tooling
        run: python -m pip install -e ".[dev]" pip-audit

      - name: Run bounded health checks
        id: checks
        shell: bash
        run: |
          set +e
          ruff check . > /tmp/ruff.txt 2>&1
          echo "ruff_exit=$?" >> "$GITHUB_OUTPUT"

          pytest -q > /tmp/pytest.txt 2>&1
          echo "pytest_exit=$?" >> "$GITHUB_OUTPUT"

          pip-audit --progress-spinner off > /tmp/pip-audit.txt 2>&1
          echo "audit_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect repository state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr list --state open --limit 20 \
            --json number,title,headRefName,url \
            --jq '.[] | "- #\(.number) [\(.title)](\(.url)) (`\(.headRefName)`)"' \
            > /tmp/open-prs.txt
          if [ ! -s /tmp/open-prs.txt ]; then
            echo "- None" > /tmp/open-prs.txt
          fi

      - name: Post daily program-board update
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUFF_EXIT: ${{ steps.checks.outputs.ruff_exit }}
          PYTEST_EXIT: ${{ steps.checks.outputs.pytest_exit }}
          AUDIT_EXIT: ${{ steps.checks.outputs.audit_exit }}
        shell: bash
        run: |
          status() {
            if [ "$1" = "0" ]; then echo "PASS"; else echo "FAIL"; fi
          }

          {
            echo "## Daily project health"
            echo
            echo "**Run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "**Commit:** \`$GITHUB_SHA\`"
            echo "**UTC:** $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo
            echo "### Quality gates"
            echo "- Ruff: **$(status "$RUFF_EXIT")**"
            echo "- Pytest: **$(status "$PYTEST_EXIT")**"
            echo "- Python dependency audit: **$(status "$AUDIT_EXIT")**"
            echo
            echo "### Open pull requests"
            cat /tmp/open-prs.txt
            echo
            echo "### Ruff output"
            echo '```text'
            tail -n 40 /tmp/ruff.txt
            echo '```'
            echo
            echo "### Pytest output"
            echo '```text'
            tail -n 40 /tmp/pytest.txt
            echo '```'
            echo
            echo "### Dependency audit output"
            echo '```text'
            tail -n 40 /tmp/pip-audit.txt
            echo '```'
            echo
            echo "### Agent harness"
            echo "This workflow is health/status automation only. It does not enable enforcement, publish releases, deploy production infrastructure, modify secrets, rewrite history, or bypass the human-approval gates in \`.github/AGENT_HARNESS.md\`."
          } > /tmp/program-board.md

          gh issue comment 14 --body-file /tmp/program-board.md

      - name: Fail workflow when quality gates fail
        if: always()
        env:
          RUFF_EXIT: ${{ steps.checks.outputs.ruff_exit }}
          PYTEST_EXIT: ${{ steps.checks.outputs.pytest_exit }}
          AUDIT_EXIT: ${{ steps.checks.outputs.audit_exit }}
        shell: bash
        run: |
          if [ "$RUFF_EXIT" != "0" ] || [ "$PYTEST_EXIT" != "0" ] || [ "$AUDIT_EXIT" != "0" ]; then
            exit 1
          fi
