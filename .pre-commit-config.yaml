# Catches locally what CI would otherwise reject. Install with `make hooks`.
#
# These hooks are a fast subset, not a replacement for `make verify` - they
# deliberately skip the test suite, the detection benchmark and the image
# builds so that committing stays quick.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-yaml
        # The generated agent workflow carries GitHub expression syntax that
        # the strict parser rejects; it is validated by its own governance check.
        exclude: ^\.github/workflows/.*\.lock\.yml$
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff pin in requirements/dev.txt.
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Run from the local environment so the hook type-checks against the same
  # dependency versions the project installs, rather than an isolated set.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        require_serial: true

      - id: agent-governance
        name: validate agent governance
        entry: .venv/bin/python .github/scripts/validate_agent_governance.py
        language: system
        pass_filenames: false
        files: ^\.github/(agent-policy\.json|AGENT_.*\.md|CODEOWNERS|agents/.*|workflows/daily-autonomous-maintainer\..*)$
