services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-privashield}
      POSTGRES_USER: ${POSTGRES_USER:-privashield}
      # No default: compose stops until .env sets it (cp .env.example .env).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (cp .env.example .env)}
    volumes:
      - privashield-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-privashield} -d ${POSTGRES_DB:-privashield}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - privashield-nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    volumes:
      - privashield-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PRIVASHIELD_ENVIRONMENT: ${PRIVASHIELD_ENVIRONMENT:-production}
      PRIVASHIELD_LOG_LEVEL: ${PRIVASHIELD_LOG_LEVEL:-INFO}
      PRIVASHIELD_DATABASE_ENABLED: "true"
      PRIVASHIELD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-privashield}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (cp .env.example .env)}@postgres:5432/${POSTGRES_DB:-privashield}
      PRIVASHIELD_ENFORCEMENT_MODE: ${PRIVASHIELD_ENFORCEMENT_MODE:-observe}
      # Authentication is on by default. Turning it off needs both
      # PRIVASHIELD_AUTH_MODE=disabled and PRIVASHIELD_ENVIRONMENT=development;
      # the API refuses to start with only one of them (docs/AUTHENTICATION.md).
      PRIVASHIELD_AUTH_MODE: ${PRIVASHIELD_AUTH_MODE:-local}
      # No default: the first administrator needs this token (cp .env.example .env).
      PRIVASHIELD_BOOTSTRAP_ADMIN_TOKEN: ${PRIVASHIELD_BOOTSTRAP_ADMIN_TOKEN:?set PRIVASHIELD_BOOTSTRAP_ADMIN_TOKEN in .env (openssl rand -hex 32)}
      PRIVASHIELD_POLICY_VERIFICATION_PUBLIC_KEY: ${PRIVASHIELD_POLICY_VERIFICATION_PUBLIC_KEY:-}
      PRIVASHIELD_POLICY_VERIFICATION_KEY_ID: ${PRIVASHIELD_POLICY_VERIFICATION_KEY_ID:-local-v1}
      PRIVASHIELD_NATS_ENABLED: "true"
      PRIVASHIELD_NATS_URL: nats://nats:4222
      PRIVASHIELD_NATS_STREAM: PRIVASHIELD_EVENTS
      PRIVASHIELD_OLLAMA_ENABLED: ${PRIVASHIELD_OLLAMA_ENABLED:-false}
      PRIVASHIELD_OLLAMA_BASE_URL: http://ollama:11434
      PRIVASHIELD_OLLAMA_MODEL: ${PRIVASHIELD_OLLAMA_MODEL:-gemma3}
      PRIVASHIELD_AUDIT_PATH: /data/audit/audit.jsonl
    volumes:
      - privashield-audit:/data/audit
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  waf:
    image: ghcr.io/coreruleset/coraza-crs:4.25-caddy-alpine-lts@sha256:fca6a3df17f877739dcc96fb86aea2702474a8978ed34893541bfe2c11749c67
    environment:
      BACKEND: dashboard:80
      PORT: "8080"
      CORAZA_RULE_ENGINE: "On"
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      CORAZA_AUDIT_LOG_FORMAT: "JSON"
      CORAZA_AUDIT_ENGINE: "RelevantOnly"
      CORAZA_AUDIT_LOG: "/var/log/coraza/audit.log"
    volumes:
      - privashield-waf-audit:/var/log/coraza
    ports:
      - "127.0.0.1:${PRIVASHIELD_DASHBOARD_PORT:-8080}:8080"
    depends_on:
      - dashboard
    restart: unless-stopped

  file-monitor:
    profiles: ["host-monitor"]
    build:
      context: .
      dockerfile: services/file-monitor/Dockerfile
    environment:
      PRIVASHIELD_API_URL: http://api:8000
      PRIVASHIELD_API_TOKEN: ${PRIVASHIELD_API_TOKEN:-}
      PRIVASHIELD_WATCH_PATH: /watch
    volumes:
      - ${PRIVASHIELD_MONITOR_PATH:-./monitor}:/watch:ro
    depends_on:
      - api
    restart: unless-stopped

  suricata:
    profiles: ["network-sensors"]
    image: jasonish/suricata:8.0@sha256:46eb25a3577657665185ba7d2ef2c2c92415881b90123397c5dd63ea40a9e759
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command: ["-i", "${PRIVASHIELD_NETWORK_INTERFACE:-eth0}"]
    volumes:
      - privashield-suricata-logs:/var/log/suricata
      - privashield-suricata-state:/var/lib/suricata
    restart: unless-stopped

  suricata-collector:
    profiles: ["network-sensors"]
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    environment:
      PRIVASHIELD_API_TOKEN: ${PRIVASHIELD_API_TOKEN:-}
    command:
      - --source
      - suricata
      - --file
      - /sensor/eve.json
      - --api-url
      - http://api:8000
      - --follow
    volumes:
      - privashield-suricata-logs:/sensor:ro
    depends_on:
      - api
      - suricata
    restart: unless-stopped

  zeek:
    profiles: ["network-sensors"]
    image: zeek/zeek:9.0.0@sha256:70733f4e540ba1608e37e00c6a93d009f79734262c9ec2ba09d90aa9abc16de5
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - sh
      - -lc
      - >-
        mkdir -p /logs && cd /logs && exec zeek
        -i ${PRIVASHIELD_NETWORK_INTERFACE:-eth0}
        LogAscii::use_json=T
    volumes:
      - privashield-zeek-logs:/logs
    restart: unless-stopped

  zeek-collector:
    profiles: ["network-sensors"]
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    environment:
      PRIVASHIELD_API_TOKEN: ${PRIVASHIELD_API_TOKEN:-}
    command:
      - --source
      - zeek
      - --file
      - /sensor/conn.log
      - --zeek-log-type
      - conn
      - --api-url
      - http://api:8000
      - --follow
    volumes:
      - privashield-zeek-logs:/sensor:ro
    depends_on:
      - api
      - zeek
    restart: unless-stopped

volumes:
  privashield-postgres:
  privashield-nats:
  privashield-ollama:
  privashield-audit:
  privashield-waf-audit:
  privashield-suricata-logs:
  privashield-suricata-state:
  privashield-zeek-logs:
